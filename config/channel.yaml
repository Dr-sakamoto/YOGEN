# チャンネル全体の設定。企画書（YŌGEN チャンネル企画書・決定稿）に準拠。
channel:
  name: "YŌGEN"
  name_ascii: "YOGEN"
  kanji: "妖幻"
  tagline: "Phantoms of the floating world"
  pronunciation: "yoh-GEN (hard g)"
  language: "en"

script:
  model: "claude-opus-5-5"
  effort: "high"
  target_seconds: 50        # ショートの目標尺
  words_per_second: 2.5     # 無音プレビュー時の尺の見積もり

tts:
  provider: "silent"        # silent | elevenlabs
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

render:
  width: 1080
  height: 1920
  fps: 30
  font: "DejaVu Sans"
  bgm: ""                   # 商用利用可の音源のパス（任意）

upload:
  category_id: "27"         # Education
  default_privacy: "private"
  made_for_kids: false
  # AIで作ったリアルな画像・音声を使うときだけ true（YouTubeの開示ルール）
  contains_synthetic_media: false
  publish_hour_utc: 0       # 予約公開の時刻（UTC）。0時UTC = 米東部19-20時
