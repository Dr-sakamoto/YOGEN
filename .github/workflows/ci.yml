# テスト + 台本が変わった回の試写動画を作る。
# PRの「Artifacts」から preview-<id> をダウンロードして、スライドショーに見えないか確認する。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: pytest -q

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - name: Render changed episodes
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          tts=silent
          [ -n "$ELEVENLABS_API_KEY" ] && tts=elevenlabs
          ids=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'episodes/*/script.yaml' | cut -d/ -f2 | sort -u)
          for id in $ids; do
            [ -f "episodes/$id/script.yaml" ] && yogen render "$id" --tts "$tts"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: episodes/*/build/final.mp4
          if-no-files-found: ignore
          retention-days: 14
