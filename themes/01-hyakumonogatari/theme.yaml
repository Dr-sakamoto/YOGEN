    question: "江戸の人は、なぜ夜に集まって怪談を百話も語ったのか"
    artworks: [utamaro_nightmare, shunsho_ghost]
    short: null
  - key: oiwa
    title: "お岩さん"
    question: "なぜ幽霊の顔が破れた提灯になっているのか"
    artworks: [oiwa, kunisada_oiwa]
    short: 0002-hm-oiwa
  - key: sara_yashiki
    title: "さらやしき"
    question: "井戸から伸びる首が、なぜ皿の連なりでできているのか"
