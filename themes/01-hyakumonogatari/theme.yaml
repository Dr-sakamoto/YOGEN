    short: 0003-hm-sara-yashiki
  - key: koheiji
    title: "こはだ小平次"
    question: "蚊帳の上からのぞく骸骨は誰で、なぜ戻ってきたのか"
    artworks: [koheiji]
    short: 0004-hm-kohada-koheiji
  - key: shunen
    title: "しうねん"
    question: "幽霊も人も描かれていないのに、なぜこれが怪談の絵なのか"
    artworks: [shunen]
    short: 0005-hm-shunen
  - key: warai_hannya
    title: "笑ひはんにや"
