  # - 図の左上の札（提灯の形の題箋）は何を模しているか
  # 百物語という遊び
  # - 百物語の作法（灯心を百本など）は何に書かれているか。いつ頃から流行ったか
  # - 怪談本・怪談芝居と版画の関係（夏の芝居と幽霊物の関係を含む）
  # 比較の作品
  # - 歌麿・春章の図は、北斎より前の幽霊の描き方として何を示すか
  # 着地の候補
  # - 江戸の人にとっての「祟り」「執念」。御霊信仰との関係はどこまで言えるか
