[project]
name = "yogen"
version = "0.1.0"
description = "YŌGEN content factory: ukiyo-e yokai shorts from research notes to scheduled YouTube upload"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.11",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "requests>=2.31",
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
  "fonttools>=4.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
auth = ["google-auth-oauthlib>=1.2"]

[project.scripts]
yogen = "yogen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
