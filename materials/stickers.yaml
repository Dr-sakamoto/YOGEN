gaikotsu:
  - {material: danjuro_skeleton, method: flood, crop: [0.1, 0.2, 0.5, 0.95], tol: 50, bg: [[30, 28, 26, 55], [225, 195, 120, 40]], note: 春章 団十郎の骸骨（清玄の亡霊）}
shoki:
